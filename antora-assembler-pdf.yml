build:
  command: bundle exec asciidoctor-pdf -r asciidoctor-kroki -a kroki-default-format=png -a allow-uri-read -a kroki-max-uri-length=8000 --sourcemap
  publish: true
  keepSource: true
assembly:
  root_level: 1
  sectionMergeStrategy: fuse
  doctype: book
  attributes:
    pdf-theme: ./pdf-theme.yml
    sectnums: ""
    xrefstyle: full
    outlinelevels: '2'
    chapter-label: ''
    toclevels: '3'
