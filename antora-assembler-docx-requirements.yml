build:
  command: ./adoc-to-docx
  dir: ./build/assembler-docx-requirements
  publish: true
  keepSource: true
assembly:
  profile: pdf-requirements
  insert_start_page: false
  root_level: 1
  sectionMergeStrategy: fuse
  doctype: book
  attributes:
    sectnums: ""
    xrefstyle: full
    outlinelevels: '2'
    toclevels: '3'
