# Requirements Engineering Preset
# Standard traceability configuration for software and systems engineering
# Based on IEEE/ISO standards for requirements management

name: requirements-engineering-max
description: |
  Standard requirements traceability configuration for software and systems engineering.
  This preset provides a comprehensive set of roles and relations for traditional
  requirements-driven development projects.
version: 1.0.0
author: Antora Traceability Team
tags: [software, systems, requirements, standard, ieee]

compatibility:
  minExtensionVersion: 2.0.0

traceability:
  roles:
    - business_goal
    - user_need
    - use_case
    - quality_attribute
    - quality_scenario
    - requirement
    - design_concept
    - design_element
    - test_case
    - design_decision
    - design_element
    - constraint

  roleGuidance:
    requirement:
      page: guidance/requirement.adoc
      idPrefix: REQ
    business_goal:
      page: guidance/business_goal.adoc
    user_need:
      page: guidance/user_need.adoc
    use_case:
      page: guidance/use_case.adoc
    quality:
      page: guidance/quality.adoc
    quality_scenario:
      page: guidance/quality_requirement.adoc
    design_concept:
      page: guidance/design_concept.adoc
    design_element:
      page: guidance/design_element.adoc
      idPrefix: ARC
    test_case:
      page: guidance/test_case.adoc
      idPrefix: TST
    design_decision:
      page: guidance/design_decision.adoc
    constraint:
      page: guidance/constraint.adoc

  relations:
    business_goal:
      user_need:
        motivates:
          reverse: is_motivated_by
      quality_attribute:
        motivates:
          reverse: is_motivated_by
    user_need:
      use_case:
        described_by:
          reverse: describes
    quality:
      quality_requirement:
        characterized_by:
          reverse: characterizes
    quality_requirement:
      solution_strategy:
        drives:
          reverse: is_driven_by
    solution_strategy:
      design_concept:
        motivates:
          reverse: is_motivated_by
    design_concept:
      design_element:
        is_realized_by:
          reverse: realizes
    # Requirement relations — only requirement-to-requirement.
    requirement:
      requirement:
        refines:
          reverse: refined_by
        depends_on:
          reverse: is_prerequisite_of
        conflicts_with:
          reverse: conflicts_with
        supersedes:
          reverse: superseded_by
      design_element:
        motivates:
          reverse: is_motivated_by
      test_case:
        is_verified_by:
          reverse: verifies
    design_decision:
      design_concept:
        influences:
          reverse: influenced_by
        supersedes:
          reverse: superseded_by
      design_element:
        motivates:
          reverse: is_motivated_by
      design_decision:
        influences:
          reverse: influenced_by
        supersedes:
          reverse: superseded_by
    # Design relations
    design_element:
      design_element:
        depends_on:
          reverse: is_prerequisite_of
        refines:
          reverse: refined_by
    constraint:
      design_element:
        restricts:
          reverse: is_restricted_by

  matrices:
    - name: requirements-to-design
      description: "Forward traceability from requirements to design elements"
      rows: requirement
      columns: [design]
      coverageRelations:
        design: [addresses]

    - name: requirements-to-tests
      description: "Direct traceability from requirements to their tests"
      rows: requirement
      columns: [test]
      coverageRelations:
        test: [verifies]

neo4j:
    queries:
      - name: uncovered-requirements
        description: "Requirements without any design or test coverage"
        cypher: |
          MATCH (r:Item {role: 'requirement'})
          WHERE NOT EXISTS {
            MATCH (r)<-[:ADDRESSES|VERIFIES]-(:Item)
          }
          RETURN r.id, r.title ORDER BY r.id

      - name: design-coverage
        description: "Design elements and their requirement/test coverage"
        cypher: |
          MATCH (d:Item {role: 'design'})
          OPTIONAL MATCH (d)-[:ADDRESSES]->(r:Item {role: 'requirement'})
          OPTIONAL MATCH (d)-[:VALIDATED_BY]->(t:Item {role: 'test'})
          RETURN d.id, d.title, count(r) as requirements, count(t) as tests
          ORDER BY requirements DESC, tests DESC

      - name: traceability-chain
        description: "Full traceability chain from requirement to design to test"
        cypher: |
          MATCH path = (r:Item {role: 'requirement'})<-[:ADDRESSES]-(d:Item {role: 'design'})
                     <-[:VALIDATES]-(t:Item {role: 'test'})
          RETURN r.id as requirement, d.id as design, t.id as test
          ORDER BY r.id, d.id, t.id

      - name: impact-analysis
        description: "What would be affected by changing a requirement?"
        cypher: |
          MATCH (r:Item {id: $requirementId, role: 'requirement'})
          OPTIONAL MATCH (r)<-[:ADDRESSES]-(d:Item {role: 'design'})
          OPTIONAL MATCH (r)<-[:VERIFIES]-(t:Item {role: 'test'})
          RETURN r.id as requirement, collect(d.id) as designs, collect(t.id) as tests

      - name: circular-dependencies
        description: "Find circular dependencies between requirements"
        cypher: |
          MATCH path = (r:Item {role: 'requirement'})-[:DEPENDS_ON|REFINES*..10]->(r)
          RETURN path

documentation:
  description: |
    # Requirements Engineering Configuration

    This preset provides a standard traceability model for software and systems engineering.

    ## Roles

    | Role | Description | Typical Use |
    |------|-------------|-------------|
    | requirement | A functional or non-functional requirement | System requirements, software requirements |
    | design | A design element that addresses requirements | Architecture, components, modules |
    | test | A verification or validation procedure | Unit tests, integration tests, system tests |

    ## Pairwise Matrices

    This preset generates focused, pairwise matrices — each maps exactly one source role to
    one target role, following the forward traceability chain:

    | Matrix | From | To | Coverage Relations |
    |--------|------|----|-------------------|
    | requirements-to-design | requirement | design | addresses |
    | requirements-to-tests | requirement | test | verifies |

    Use the CLI `matrix` command to generate matrices, or configure the Antora extension
    with `generateMatrices: true` in your playbook. For backward traceability (which tests
    cover a design? which requirements does a design address?), use the Neo4j
    export or add custom matrices to your project's `traceability.yml`.

    ## Common Workflow

    1. Define requirements with `[item, id=REQ-001, role=requirement]`
    2. Create designs that address requirements with `[item, id=DES-001, role=design]`
    3. Add `addresses:REQ-001[]` inline macro in design
    4. Create tests with `[item, id=TEST-001, role=test]`
    5. Add `verifies:REQ-001[]` or `validates:DES-001[]` inline macros in test

    ## Example

    ```asciidoc
    [item, id=REQ-001, role=requirement]
    ====
    User Authentication

    The system shall authenticate users via secure credentials.
    ====

    [item, id=DES-001, role=design]
    ====
    Authentication Service

    JWT-based authentication service with token management.

    addresses:REQ-001[]
    ====

    [item, id=TEST-001, role=test]
    ====
    Authentication Tests

    Unit tests for authentication functionality.

    verifies:REQ-001[]
    validates:DES-001[]
    ====
    ```
