# Minimal Traceability Preset
# Simplest possible traceability configuration

name: minimal
description: |
  Minimal traceability configuration with just requirements and tests.
  This preset is perfect for getting started or for simple projects.
version: 1.0.0
author: Antora Traceability Team
tags: [minimal, simple, getting-started, basic]

compatibility:
  minExtensionVersion: 2.0.0

traceability:
  roles:
    - requirement
    - test

  roleGuidance:
    requirement:
      page: guidance/requirement.adoc
      idPrefix: REQ
    test:
      page: guidance/test.adoc
      idPrefix: TST

  relations:
    requirement:
      requirement:
        depends_on:
          reverse: is_prerequisite_of
        supersedes:
          reverse: superseded_by
      test:
        verified_by:
          reverse: verifies

    test:
      requirement:
        covers:
          reverse: covered_by

  matrices:
    - name: requirements-tests
      description: "Basic requirement to test traceability matrix"
      rows: requirement
      columns: [test]
      coverageRelations:
        test: [verified_by, covers]

  neo4j:
    queries:
      - name: uncovered-requirements
        description: "Requirements without any test coverage"
        cypher: |
          MATCH (r:Item {role: 'requirement'})
          WHERE NOT EXISTS {
            MATCH (r)<-[:VERIFIED_BY|COVERS]-(:Item {role: 'test'})
          }
          RETURN r.id, r.title ORDER BY r.id

      - name: test-coverage
        description: "Test coverage summary"
        cypher: |
          MATCH (r:Item {role: 'requirement'})
          OPTIONAL MATCH (r)<-[:VERIFIED_BY|COVERS]-(t:Item {role: 'test'})
          RETURN count(r) as totalRequirements, count(t) as tests,
                 toFloat(count(t)) / count(r) * 100 as coveragePercentage

      - name: all-traceability
        description: "All traceability relationships"
        cypher: |
          MATCH (a:Item)-[r]->(b:Item)
          RETURN a.id, a.role, type(r) as relation, b.id, b.role
          ORDER BY a.role, a.id, relation, b.role, b.id

documentation:
  description: |
    # Minimal Traceability Configuration

    This preset provides the simplest possible traceability setup with just
    requirements and tests. Perfect for:
    - Getting started with the extension
    - Simple projects
    - Learning the basics
    - Prototyping

    ## Roles

    | Role | Description |
    |------|-------------|
    | requirement | A requirement that the system must satisfy |
    | test | A test that verifies a requirement |

    ## Relations

    | Relation | Direction | Description |
    |----------|-----------|-------------|
    | verified_by | test -> requirement | Test verifies this requirement |
    | covers | test -> requirement | Test covers this requirement |
    | depends_on | requirement -> requirement | This requirement depends on another |

    ## Example

    ```asciidoc
    [item, id=REQ-001, role=requirement]
    ====
    User Login

    The system shall allow users to log in with valid credentials.
    ====

    [item, id=REQ-002, role=requirement]
    ====
    Password Requirements

    The system shall enforce password complexity rules.

    depends_on:REQ-001[]
    ====

    [item, id=TEST-001, role=test]
    ====
    Login Test

    Test that users can log in with valid credentials.

    verified_by:REQ-001[]
    covers:REQ-001[]
    ====

    [item, id=TEST-002, role=test]
    ====
    Password Validation Test

    Test that password complexity is enforced.

    verified_by:REQ-002[]
    covers:REQ-002[]
    ====
    ```

    ## Next Steps

    Once you're comfortable with this minimal setup, try:
    1. The `requirements-engineering` preset for more roles
    2. The `agile` preset for user stories and tasks
    3. Creating your own custom preset
