site:
  title: Antora Tracer — Self-Traceability Example (PDF)
  url: https://antora-tracer.conemso.de/docs
  start_page: tracer::index.adoc

content:
  sources:
    - url: .
      start_path: examples/tracer
      branches: HEAD

asciidoc:
  attributes:
    pdf-theme: default
    kroki-default-format: png
  extensions:
    - asciidoctor-kroki

antora:
  extensions:
    - require: ./lib/src/antora-extension.js
      preset: self-traceability
      configPath: ./examples/traceability.yml
      outputDir: traceability
      generateMatrices: true
      matrixFormats: [html, csv]
      includeInNavigation: true
    - require: ./antora-pdf-extension.cjs
      config_files:
        - antora-assembler-pdf.yml
        - antora-assembler-pdf-architecture.yml
        - antora-assembler-pdf-use-cases.yml
        - antora-assembler-pdf-requirements.yml
        - antora-assembler-pdf-test-plan.yml
    - require: ./antora-docx-extension.cjs
      config_files:
        - antora-assembler-docx.yml
        - antora-assembler-docx-architecture.yml
        - antora-assembler-docx-requirements.yml
        - antora-assembler-docx-use-cases.yml
        - antora-assembler-docx-test-plan.yml

output:
  dir: ./build/pdf-output
  clean: true

ui:
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/HEAD/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true
