packages:
  - id-server
# pnpm 12 reads `overrides` from this file, not from package.json — a
# package.json `overrides` block is silently ignored in a workspace with a
# shared lockfile, so the previous js-yaml override never applied.
overrides:
  # Patched versions for open Dependabot advisories. Every parent declares a
  # narrower range than the fix (e.g. isomorphic-git ~1.25 vs 1.38.6), so each
  # needs an explicit override rather than a plain update.
  handlebars: ^4.7.10
  js-yaml: ^4.3.2
  isomorphic-git: ^1.38.6
  minimatch: ^11.0.1
  serialize-javascript: ^7.1.3
  # load-nyc-config uses the js-yaml 3.x API, so scope it back off the global
  # 4.x override while still pinning the patched 3.x release.
  '@istanbuljs/load-nyc-config>js-yaml': ^3.15.1
allowBuilds:
  esbuild: true
patchedDependencies:
  '@antora/assembler@1.0.0-beta.20': patches/@antora+assembler+1.0.0-beta.20.patch
  '@antora/lunr-extension@1.0.0-alpha.13': patches/@antora+lunr-extension+1.0.0-alpha.13.patch
permissions:
  dotenv:
    skills: true
