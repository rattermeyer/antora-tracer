# Agile/Scrum Preset
# Traceability configuration for agile software development

name: agile
description: |
  Agile/Scrum traceability configuration for user stories, tasks, and tests.
  This preset is designed for agile teams using Scrum or Kanban methodologies.
version: 1.0.0
author: Antora Traceability Team
tags: [agile, scrum, kanban, user-story]

compatibility:
  minExtensionVersion: 2.0.0

traceability:
  roles:
    - epic
    - feature
    - user_story
    - acceptance_criterion
    - task
    - spike
    - bug
    - test

  relations:
    # Epic relations
    epic:
      feature:
        contains:
          reverse: contained_in
      user_story:
        contains:
          reverse: contained_in
      test:
        validated_by:
          reverse: validates

    # Feature relations
    feature:
      user_story:
        broken_down_into:
          reverse: broken_down_from
      test:
        verified_by:
          reverse: verifies

    # User story relations
    user_story:
      epic:
        part_of:
          reverse: contains
      feature:
        part_of:
          reverse: contains
      acceptance_criterion:
        has:
          reverse: belongs_to
      task:
        broken_down_into:
          reverse: broken_down_from
      spike:
        requires:
          reverse: required_by
      test:
        verified_by:
          reverse: verifies
      bug:
        affected_by:
          reverse: affects

    # Acceptance criterion relations
    acceptance_criterion:
      user_story:
        belongs_to:
          reverse: has
      test:
        validated_by:
          reverse: validates

    # Task relations
    task:
      user_story:
        implements:
          reverse: implemented_by
      spike:
        implements:
          reverse: implemented_by
      test:
        affects:
          reverse: affected_by
      bug:
        fixes:
          reverse: fixed_by

    # Spike relations
    spike:
      user_story:
        investigates:
          reverse: investigated_by
      task:
        results_in:
          reverse: result_of

    # Bug relations
    bug:
      user_story:
        blocks:
          reverse: blocked_by
      task:
        fixed_by:
          reverse: fixes
      test:
        reproduced_by:
          reverse: reproduces

    # Test relations
    test:
      user_story:
        verifies:
          reverse: verified_by
      acceptance_criterion:
        validates:
          reverse: validated_by
      task:
        tests:
          reverse: tested_by
      spike:
        tests:
          reverse: tested_by
      bug:
        reproduces:
          reverse: reproduced_by

  matrices:
    - name: epic-progress
      description: "Epic breakdown showing features, stories, tasks, and tests"
      rows: epic
      columns: [feature, user_story, task, test, bug]
      coverageRelations:
        feature: [contains]
        user_story: [contains, broken_down_into]
        task: [broken_down_into, implements]
        test: [validated_by, verified_by, validates, tests]
        bug: [affected_by, blocks]

    - name: story-completion
      description: "User story completion with acceptance criteria and tests"
      rows: user_story
      columns: [acceptance_criterion, task, test, bug]
      coverageRelations:
        acceptance_criterion: [has, belongs_to]
        task: [broken_down_into, implements]
        test: [verified_by, validates, tests]
        bug: [affected_by, blocks]

    - name: sprint-backlog
      description: "Tasks and their relationships to stories and bugs"
      rows: task
      columns: [user_story, spike, bug, test]
      coverageRelations:
        user_story: [implements]
        spike: [implements, results_in]
        bug: [fixes]
        test: [affects, tests]

    - name: test-coverage
      description: "Test coverage across user stories and acceptance criteria"
      rows: test
      columns: [user_story, acceptance_criterion, task, bug]
      coverageRelations:
        user_story: [verifies]
        acceptance_criterion: [validates]
        task: [tests]
        bug: [reproduces, reproduced_by]

  neo4j:
    queries:
      - name: incomplete-stories
        description: "User stories without acceptance criteria or tests"
        cypher: |
          MATCH (s:Item {role: 'user_story'})
          WHERE NOT EXISTS {
            MATCH (s)-[:HAS]->(:Item {role: 'acceptance_criterion'})
          }
          OR NOT EXISTS {
            MATCH (s)<-[:VERIFIES|VALIDATES]-(:Item {role: 'test'})
          }
          RETURN s.id, s.title ORDER BY s.id

      - name: blocked-stories
        description: "User stories blocked by bugs"
        cypher: |
          MATCH (s:Item {role: 'user_story'})-[:AFFECTED_BY]->(b:Item {role: 'bug'})
          WHERE NOT EXISTS {
            MATCH (b)<-[:FIXES]-(:Item {role: 'task'})
          }
          RETURN s.id as story, s.title as storyTitle, collect(b.id) as blockingBugs
          ORDER BY s.id

      - name: story-hierarchy
        description: "Complete hierarchy from epic to task"
        cypher: |
          MATCH path = (e:Item {role: 'epic'})-[:CONTAINS]->(f:Item {role: 'feature'})
                     -[:BROKEN_DOWN_INTO*]->(s:Item {role: 'user_story'})
                     -[:BROKEN_DOWN_INTO]->(t:Item {role: 'task'})
          RETURN e.id as epic, f.id as feature, s.id as story, t.id as task
          ORDER BY e.id, f.id, s.id, t.id

      - name: test-coverage-by-story
        description: "Test coverage percentage per user story"
        cypher: |
          MATCH (s:Item {role: 'user_story'})
          OPTIONAL MATCH (s)<-[:VERIFIES|VALIDATES]-(t:Item {role: 'test'})
          OPTIONAL MATCH (s)-[:HAS]->(ac:Item {role: 'acceptance_criterion'})
          WITH s, count(t) as testCount, count(ac) as acCount
          RETURN s.id, s.title, testCount, acCount,
                 CASE WHEN acCount > 0 THEN toFloat(testCount) / acCount * 100 ELSE 0 END as coverage
          ORDER BY coverage ASC, s.id

      - name: unestimated-tasks
        description: "Tasks without size/estimate (if using estimation)"
        cypher: |
          MATCH (t:Item {role: 'task'})
          WHERE NOT EXISTS(t.estimate)
          RETURN t.id, t.title
          ORDER BY t.id

documentation:
  description: |
    # Agile/Scrum Traceability Configuration

    This preset provides a traceability model optimized for agile development teams.

    ## Roles

    | Role | Description | Agile Equivalent |
    |------|-------------|------------------|
    | epic | Large user story or initiative | Epic |
    | feature | Collection of related user stories | Feature |
    | user_story | User-facing requirement | User Story |
    | acceptance_criterion | Condition for story completion | Acceptance Criterion |
    | task | Development task | Task |
    | spike | Research/investigation task | Spike |
    | bug | Defect or issue | Bug |
    | test | Verification procedure | Test |

    ## Common Workflow

    1. Define epics with `[item, id=EP-001, role=epic]`
    2. Break epics into features with `[item, id=FEAT-001, role=feature]`
    3. Add `contains:EP-001[]` inline macro in feature
    4. Create user stories with `[item, id=US-001, role=user_story]`
    5. Add `broken_down_into:FEAT-001[]` or `part_of:EP-001[]` inline macros
    6. Add acceptance criteria with `[item, id=AC-001, role=acceptance_criterion]`
    7. Link criteria to story with `belongs_to:US-001[]` or `has:AC-001[]` in story
    8. Create tasks with `[item, id=TASK-001, role=task]`
    9. Link tasks to stories with `implements:US-001[]`

    ## Example

    ```asciidoc
    [item, id=EP-001, role=epic]
    ====
    User Authentication Feature

    As a user, I want to securely authenticate to access the system.
    ====

    [item, id=FEAT-001, role=feature]
    ====
    Login Functionality

    Includes login form, session management, and logout.

    part_of:EP-001[]
    ====

    [item, id=US-001, role=user_story]
    ====
    Login with credentials

    As a user, I want to login with my username and password
    so that I can access my account.

    part_of:FEAT-001[]
    ====

    [item, id=AC-001, role=acceptance_criterion]
    ====
    Successful login

    User is redirected to dashboard after successful login.

    belongs_to:US-001[]
    ====

    [item, id=AC-002, role=acceptance_criterion]
    ====
    Invalid credentials

    User sees error message for invalid credentials.

    belongs_to:US-001[]
    ====

    [item, id=TASK-001, role=task]
    ====
    Implement login form

    Create HTML form with username and password fields.

    implements:US-001[]
    ====

    [item, id=TEST-001, role=test]
    ====
    Login form validation tests

    Tests for form validation and error handling.

    verifies:US-001[]
    validates:AC-001[]
    validates:AC-002[]
    ====
    ```
