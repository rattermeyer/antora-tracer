font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='170.4821' x='391.926' y='370.2292'>&#8226; asciidoctor-kroki diagrams</text><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='177.2552' x='391.926' y='387.9352'>&#8226; custom [item] block macros</text><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='129.2721' x='391.926' y='405.6412'>&#8226; Antora xref: macros</text><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='102.3881' x='391.926' y='423.3473'>&#8594; Broken output</text><rect fill='#F8F9FA' height='36.3441' rx='12.5' ry='12.5' style='stroke:#888888;stroke-width:0.5;' width='162.177' x='203.7489' y='355.8661'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='142.177' x='213.7489' y='378.6942'>pandoc -f asciidoc -t docx</text><rect fill='#F8F9FA' height='52.6882' rx='12.5' ry='12.5' style='stroke:#888888;stroke-width:0.5;' width='195.5853' x='187.0448' y='467.1563'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='175.5853' x='197.0448' y='489.9843'>&#10060; DOCX with missing diagrams</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='119.4368' x='197.0448' y='506.3285'>and mangled macros</text><line style='stroke:#000000;stroke-width:1.5;' x1='181.0448' x2='181.0448' y1='13.774' y2='717.5038'/><path d='M824.3052,171.978 L824.3052,234.9491 L804.3052,238.9491 L824.3052,242.9491 L824.3052,305.9202 A0,0 0 0 0 824.3052,305.9202 L1083.5044,305.9202 A0,0 0 0 0 1083.5044,305.9202 L1083.5044,181.978 L1073.5044,171.978 L824.3052,171.978 A0,0 0 0 0 824.3052,171.978' fill='#E8F5E9' style='stroke:#181818;stroke-width:0.5;'/><path d='M1073.5044,171.978 L1073.5044,181.978 L1083.5044,181.978 L1073.5044,171.978' fill='#E8F5E9' style='stroke:#181818;stroke-width:0.5;'/><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='187.3952' x='830.3052' y='190.8751'>DocBook is asciidoctor's native</text><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='184.6912' x='830.3052' y='208.5811'>structured output. All features</text><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='65.039' x='830.3052' y='226.2871'>preserved:</text><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='231.8552' x='830.3052' y='243.9931'>&#8226; Kroki diagrams &#8594; embedded images</text><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='197.6131' x='830.3052' y='261.6991'>&#8226; xrefs &#8594; DocBook xref elements</text><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='238.1992' x='830.3052' y='279.4051'>&#8226; Admonitions &#8594; DocBook admonitions</text><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='135.5251' x='830.3052' y='297.1112'>&#8226; Tables &#8594; CALS tables</text><rect fill='#F8F9FA' height='69.0323' rx='12.5' ry='12.5' style='stroke:#888888;stroke-width:0.5;' width='177.0931' x='627.2121' y='204.4329'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='127.5729' x='637.2121' y='227.261'>asciidoctor -b docbook</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='105.3128' x='637.2121' y='243.6051'>-r asciidoctor-kroki</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='157.0931' x='637.2121' y='259.9492'>-a kroki-default-format=png</text><rect fill='#F8F9FA' height='52.6882' rx='12.5' ry='12.5' style='stroke:#888888;stroke-width:0.5;' width='97.8326' x='666.8424' y='340.203'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='77.8326' x='676.8424' y='363.0311'>DocBook XML</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='43.6683' x='676.8424' y='379.3752'>(stdout)</text><path d='M818.7852,427.8912 L818.7852,482.0093 L798.7852,486.0093 L818.7852,490.0093 L818.7852,544.1273 A0,0 0 0 0 818.7852,544.1273 L1065.0103,544.1273 A0,0 0 0 0 1065.0103,544.1273 L1065.0103,437.8912 L1055.0103,427.8912 L818.7852,427.8912 A0,0 0 0 0 818.7852,427.8912' fill='#E8F5E9' style='stroke:#181818;stroke-width:0.5;'/><path d='M1055.0103,427.8912 L1055.0103,437.8912 L1065.0103,437.8912 L1055.0103,427.8912' fill='#E8F5E9' style='stroke:#181818;stroke-width:0.5;'/><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='219.3622' x='824.7852' y='446.7882'>Pandoc's docbook reader is mature.</text><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='57.8241' x='824.7852' y='464.4942'>Converts:</text><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='187.2521' x='824.7852' y='482.2003'>&#8226; xref &#8594; Word cross-references</text><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='182.9622' x='824.7852' y='499.9063'>&#8226; images &#8594; embedded in docx</text><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='143.1301' x='824.7852' y='517.6123'>&#8226; TOC &#8594; Word TOC field</text><text fill='#000000' font-family='sans-serif' font-size='13' lengthAdjust='spacing' textLength='225.2252' x='824.7852' y='535.3183'>&#8226; SVG images &#8594; PNG via rsvg-convert</text><rect fill='#F8F9FA' height='36.3441' rx='12.5' ry='12.5' style='stroke:#888888;stroke-width:0.5;' width='166.0531' x='632.7321' y='467.8372'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='146.0531' x='642.7321' y='490.6653'>pandoc -f docbook -t docx</text><rect fill='#F8F9FA' height='85.3765' rx='12.5' ry='12.5' style='stroke:#888888;stroke-width:0.5;' width='149.7569' x='640.8802' y='564.1273'/><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='117.0115' x='650.8802' y='586.9554'>&#10003; well-formed DOCX</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='112.0568' x='650.8802' y='603.2995'>with navigable TOC,</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='96.5887' x='650.8802' y='619.6436'>cross-references,</text><text fill='#000000' font-family='sans-serif' font-size='12' lengthAdjust='spacing' textLength='129.7569' x='650.8802' y='635.9877'>and embedded images</text><rect fill='#555555' height='6' rx='2.5' ry='2.5' style='stroke:#555555;stroke-width:1;' width='483.9173' x='611.5871' y='669.5038'/><ellipse cx='634.5871' cy='706.5038' fill='none' rx='11' ry='11' style='stroke:#222222;stroke-width:1;'/><ellipse cx='634.5871' cy='706.5038' fill='#222222' rx='6' ry='6' style='stroke:#222222;stroke-width:1;'/><line style='stroke:#000000;stroke-width:1.5;' x1='605.5871' x2='605.5871' y1='13.774' y2='717.5038'/><line style='stroke:#000000;stroke-width:1.5;' x1='1099.5044' x2='1099.5044' y1='13.774' y2='717.5038'/><line style='stroke:#181818;stroke-width:1;' x1='99.0224' x2='99.0224' y1='63.2898' y2='83.2898'/><polygon fill='#181818' points='95.0224,73.2898,99.0224,83.2898,103.0224,73.2898,99.0224,77.2898' style='stroke:#181818;stroke-width:1;'/><line style='stroke:#181818;stroke-width:1;' x1='99.0224' x2='99.0224' y1='135.978' y2='155.978'/><polygon fill='#181818' points='95.0224,145.978,99.0224,155.978,103.0224,145.978,99.0224,149.978' style='stroke:#181818;stroke-width:1;'/><line style='stroke:#181818;stroke-width:1;' x1='284.8375' x2='284.8375' y1='392.2103' y2='467.1563'/><pol