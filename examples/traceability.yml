# Self-Traceability Configuration
# Extends the requirements-engineering preset with use_case role for the example site

extends: requirements-engineering

roles:
  - use_case

relations:
  use_case:
    requirement: ["leads_to"]

matrices:
  - name: usecase-requirements
    description: "Use cases traced to requirements"
    rows: use_case
    columns: [requirement]
    coverageRelations:
      requirement: [leads_to]

inverseLabels:
  leads_to: "is_derived_from"
