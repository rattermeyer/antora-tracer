# Self-Traceability Configuration
# Domain model for tracing the antora-tracer extension itself

roles:
  - requirement
  - architecture
  - test

relations:
  requirement:
    requirement: [refines, depends_on]

  architecture:
    requirement: [addresses]
    architecture: [composed_of]

  test:
    requirement: [verifies]
    architecture: [validates]

matrices:
  - name: requirements-architecture
    description: "Requirements traced to architecture sections"
    rows: requirement
    columns: [architecture]
    coverageRelations:
      architecture: [addresses]

  - name: requirements-tests
    description: "Requirements traced to test files"
    rows: requirement
    columns: [test]
    coverageRelations:
      test: [verifies]
