site:
  title: Antora Tracer — Self-Traceability Example
  url: https://antora-tracer.conemso.de/docs
  start_page: tracer::index.adoc
  keys:
    annotatejs: opt-out

content:
  sources:
    - url: https://github.com/rattermeyer/antora-tracer.git
      start_path: examples/tracer
      branches: ['main', 'v0.20.x']
    - url: https://github.com/rattermeyer/antora-tracer.git
      start_path: blog
      branches: ['main']

asciidoc:
  extensions:
    - asciidoctor-kroki

antora:
  extensions:
    - require: ./lib/src/antora-extension.js
      configPath: ./examples/traceability.yml
      outputDir: traceability
      generateMatrices: true
      matrixFormats: [html, csv]
      includeInNavigation: true
    - require: '@antora/lunr-extension'
      index_by_heading: true
    - require: ./lib/src/antora-vale-extension.js
      enabled: true
      valeConfig: lib/src/vale/.vale.ini
      minLevel: warning
      exclude:
        - documentation-style-guide.adoc

ui:
  bundle:
    url: https://github.com/rattermeyer/antora-ui-conemso/releases/download/v1.1.3/ui-bundle.zip

urls:
  latest_version_segment: latest
  redirect_facility: static
  latest_prerelease_version_segment: unstable


output:
  dir: ./public/docs
  clean: true
