name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'

      # ---- @antora-tracer/core ----
      - name: Install (core)
        run: npm ci

      - name: Apply patches
        run: npx patch-package

      - name: Build (core)
        run: npm run build

      - name: Test (core)
        run: npm test

      - name: Stage (core)
        run: npm stage publish --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ---- @antora-tracer/id-server ----
      - name: Install (id-server)
        run: npm ci
        working-directory: id-server

      - name: Build (id-server)
        run: npm run build
        working-directory: id-server

      - name: Test (id-server)
        run: npm test
        working-directory: id-server

      - name: Stage (id-server, skip if version unchanged)
        working-directory: id-server
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@antora-tracer/id-server@${VERSION}" version >/dev/null 2>&1; then
            echo "id-server@${VERSION} already published — skipping"
          else
            npm stage publish --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ---- SBOM + cosign (keyless) ----
      - uses: sigstore/cosign-installer@v3

      - name: Generate SBOM (core)
        run: npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-file bom-core.json

      - name: Sign SBOM (core)
        run: cosign sign-blob --yes bom-core.json --bundle bom-core.json.bundle

      - name: Generate SBOM (id-server)
        run: npx --yes @cyclonedx/cyclonedx-npm --omit dev --output-file bom-id-server.json
        working-directory: id-server

      - name: Sign SBOM (id-server)
        run: cosign sign-blob --yes bom-id-server.json --bundle bom-id-server.json.bundle
        working-directory: id-server

      - name: Attach SBOMs to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bom-core.json
            bom-core.json.bundle
            id-server/bom-id-server.json
            id-server/bom-id-server.json.bundle
