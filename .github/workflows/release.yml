name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          registry-url: 'https://registry.npmjs.org'
          cache: 'pnpm'

      # ---- @antora-tracer/core ----
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build (core)
        run: pnpm run build

      - name: Test (core)
        run: pnpm test

      - name: Publish (core, skip if version unchanged)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if pnpm view "@antora-tracer/core@${VERSION}" version >/dev/null 2>&1; then
            echo "core@${VERSION} already published — skipping"
          else
            pnpm --filter @antora-tracer/core publish --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ---- @antora-tracer/id-server ----
      - name: Build (id-server)
        run: pnpm --filter @antora-tracer/id-server run build

      - name: Test (id-server)
        run: pnpm --filter @antora-tracer/id-server test

      - name: Publish (id-server, skip if version unchanged)
        run: |
          VERSION=$(node -p "require('./id-server/package.json').version")
          if pnpm view "@antora-tracer/id-server@${VERSION}" version >/dev/null 2>&1; then
            echo "id-server@${VERSION} already published — skipping"
          else
            pnpm --filter @antora-tracer/id-server publish --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # ---- SBOM + cosign (keyless) ----
      - uses: sigstore/cosign-installer@v3

      - name: Generate SBOM (core)
        run: pnpm dlx @cyclonedx/cyclonedx-npm --omit dev --output-file bom-core.json

      - name: Sign SBOM (core)
        run: cosign sign-blob --yes bom-core.json --bundle bom-core.json.bundle

      - name: Generate SBOM (id-server)
        run: pnpm dlx @cyclonedx/cyclonedx-npm --omit dev --output-file bom-id-server.json
        working-directory: id-server

      - name: Sign SBOM (id-server)
        run: cosign sign-blob --yes bom-id-server.json --bundle bom-id-server.json.bundle
        working-directory: id-server

      - name: Attach SBOMs to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bom-core.json
            bom-core.json.bundle
            id-server/bom-id-server.json
            id-server/bom-id-server.json.bundle

  docker:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - name: Extract id-server version
        id: version
        run: echo "version=$(jq -r .version id-server/package.json)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: id-server/Dockerfile
          push: true
          provenance: true
          sbom: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/id-server:latest
            ghcr.io/${{ github.repository_owner }}/id-server:${{ steps.version.outputs.version }}
