name: Pages

on:
  push:
    branches: [main]

# Grant GITHUB_TOKEN the permissions required for Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment. Do NOT cancel in-progress runs: a cancelled
# Pages deployment can leave the Pages service rejecting the next one with
# "Deployment failed, try again later". Queue instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'pnpm'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pandoc librsvg2-bin asciidoctor

      - run: pnpm install --frozen-lockfile

      - name: Build extension
        run: pnpm run build

      - name: Release consistency check
        run: node scripts/release-check.js

      - name: Compile tests
        run: pnpm exec tsc -p tsconfig.test.json
        # The landing-stats generator (run by preview.js) reads the passing
        # count from the compiled suite — no separate verification step.

      - name: Install Vale
        run: |
          curl -sfL https://github.com/errata-ai/vale/releases/download/v3.15.1/vale_3.15.1_Linux_64-bit.tar.gz | tar xz -C /usr/local/bin vale
          vale --version

      - name: Build site
        run: node scripts/preview.js --ci

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public

  # Deploy in its own job: deploy-pages queries artifact metadata immediately
  # after upload, and in a single job it intermittently fails with "No artifacts
  # named github-pages" before the artifact API has propagated
  # (actions/deploy-pages#451). A job boundary plus the environment gate gives
  # the artifact time to settle and is the documented Pages pattern.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
