name: Pages

on:
  push:
    branches: [main]

# Grant GITHUB_TOKEN the permissions required for Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true

      - run: npm ci

      - name: Apply patches
        run: npx patch-package

      - name: Build extension
        run: npm run build

      - name: Build site
        run: npx antora antora-playbook-ci.yml

      - name: Build PDF
        run: KROKI_IMAGE_FORMAT=png npx antora antora-playbook-pdf.yml

      - name: Copy PDFs for deployment
        run: |
          mkdir -p public/pdf
          component_version=$(grep '^version:' examples/tracer/antora.yml | awk '{print $2}')
          exports_dir="build/pdf-output/tracer/${component_version}/_exports"
          for pdf in architecture use-cases requirements test-plan; do
            cp "$exports_dir/${pdf}.pdf" public/pdf/
          done

      - name: Copy landing page
        run: cp -r landing/* public/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
