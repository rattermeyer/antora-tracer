server:
  address: 'tcp://:9091'
  endpoints:
    authz:
      forward-auth:
        implementation: 'ForwardAuth'

log:
  level: 'info'

identity_validation:
  reset_password:
    jwt_secret: 'unsecure_jwt_secret_for_demo_only_0123456789'

authentication_backend:
  file:
    path: '/config/users.yml'
    password:
      algorithm: 'argon2'

access_control:
  default_policy: 'deny'
  rules:
    - domain: 'example.com'
      policy: 'one_factor'

session:
  secret: 'unsecure_session_secret_for_demo_only_change_me_1234567890'
  cookies:
    - domain: 'example.com'
      authelia_url: 'https://auth.example.com'
      default_redirection_url: 'https://example.com'

storage:
  encryption_key: 'unsecure_encryption_key_for_demo_only_0123456789'
  local:
    path: '/data/db.sqlite3'

notifier:
  filesystem:
    filename: '/data/notification.txt'
